<style>.case{fill:url(#t74-case);stroke:#8798a9;stroke-width:1.6}.hot{fill:none;stroke:#ca5264;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.cold{fill:none;stroke:#548eaf;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#8798a9;stroke-width:1.3}.label{font:12px Arial,sans-serif;fill:#52677a}.title{font:600 15px Arial,sans-serif;fill:#294158}.value{font:600 16px Arial,sans-serif;fill:#20384e}.small{font:11px Arial,sans-serif;fill:#52677a}.pump{fill:#fff;stroke:#72889b;stroke-width:2}.pump[data-active="true"]{stroke:#46a16d;stroke-width:3}.pump[data-known="false"]{stroke-dasharray:3 3}.burner[data-active="false"]{opacity:.3;filter:grayscale(1)}.burner[data-known="false"]{opacity:.2}</style>
